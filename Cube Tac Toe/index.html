<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cube Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <h1>Cube&nbsp;Tac&nbsp;Toe</h1>
      <div id="turn" class="turn-x">
        <span id="turn-player">Player X</span>
        <span id="turn-phase">place your mark</span>
      </div>
      <p id="hint">Drag anywhere to rotate the whole cube and inspect all sides.
        Click an empty white sticker to place your mark, then make one cube move.</p>
      <button id="reset">New Game</button>
    </div>

    <div id="result" class="hidden">
      <div class="result-box">
        <p id="result-text"></p>
        <button id="result-reset">Play Again</button>
      </div>
    </div>

    <div id="moves">
      <div class="move-label">Make a move:</div>
      <div class="move-grid">
        <button class="move-btn" data-move="U">U</button>
        <button class="move-btn" data-move="U'">U&#39;</button>
        <button class="move-btn" data-move="D">D</button>
        <button class="move-btn" data-move="D'">D&#39;</button>
        <button class="move-btn" data-move="L">L</button>
        <button class="move-btn" data-move="L'">L&#39;</button>
        <button class="move-btn" data-move="R">R</button>
        <button class="move-btn" data-move="R'">R&#39;</button>
        <button class="move-btn" data-move="F">F</button>
        <button class="move-btn" data-move="F'">F&#39;</button>
        <button class="move-btn" data-move="B">B</button>
        <button class="move-btn" data-move="B'">B&#39;</button>
      </div>
    </div>
  </div>

  <!-- Three.js + OrbitControls (UMD classic builds so the game runs from file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="game.js"></script>
</body>
</html>
